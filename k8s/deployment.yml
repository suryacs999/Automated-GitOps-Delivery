apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-cd-pipeline
  template:
    metadata:
      labels:
        app: ci-cd-pipeline
    spec:
      containers:
      - name: ci-cd-pipeline
        image: arca9/ci-cd-pipeline:2
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-svc
spec:
  type: LoadBalancer
  selector:
    app: ci-cd-pipeline
  ports:
  - port: 80
    targetPort: 3000
